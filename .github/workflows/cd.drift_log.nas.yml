name: cd.drift_log.nas.yml

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build-and-deploy-to-nas:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 3. Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./drift_log
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/driftlog-backend:latest

      - name: 4. Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./front/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/driftlog-frontend:latest
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            VITE_KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            VITE_APPLE_CLIENT_ID=com.kangila.driftlog.web
            VITE_APPLE_REDIRECT_URI=https://driftlog.kro.kr

      - name: 5. Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: ${{ secrets.NAS_HOST }}

      - name: 6. Configure SSH
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/nas_deploy_key <<'EOF'
          ${{ secrets.NAS_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/nas_deploy_key

      - name: 7. Deploy on TrueNAS
        env:
          NAS_HOST: ${{ secrets.NAS_HOST }}
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_APP_DIR: ${{ secrets.NAS_APP_DIR }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
        run: |
          set -e
          cat > .env.nas <<EOF
          DB_NAME=${DB_NAME}
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}
          DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
          JWT_SECRET=${JWT_SECRET}
          WEATHER_API_KEY=${WEATHER_API_KEY}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
          KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
          KAKAO_REDIRECT_URI=${KAKAO_REDIRECT_URI}
          GRAFANA_PASSWORD=${GRAFANA_PASSWORD}
          EOF

          ssh -i ~/.ssh/nas_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new "${NAS_USER}@${NAS_HOST}" "mkdir -p '${NAS_APP_DIR}'"
          scp -i ~/.ssh/nas_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new docker-compose.nas.yml "${NAS_USER}@${NAS_HOST}:${NAS_APP_DIR}/compose.yaml"
          scp -i ~/.ssh/nas_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new .env.nas "${NAS_USER}@${NAS_HOST}:${NAS_APP_DIR}/.env"
          ssh -i ~/.ssh/nas_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new "${NAS_USER}@${NAS_HOST}" "cd '${NAS_APP_DIR}' && sudo docker network inspect proxy >/dev/null 2>&1 || sudo docker network create proxy && cd '${NAS_APP_DIR}' && sudo docker compose --env-file .env -f compose.yaml pull && sudo docker compose --env-file .env -f compose.yaml up -d && sudo docker image prune -f"
